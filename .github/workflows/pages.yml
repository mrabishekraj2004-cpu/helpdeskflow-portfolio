name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: postgresql://unused@127.0.0.1:5432/build_only
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: pages-build-placeholder-not-used-for-authentication-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - name: Deploy public portfolio
        id: deployment
        uses: actions/deploy-pages@v4
